{"path":"pyproject.toml","branch":"main","content":"[build-system]\nrequires = [\"hatchling\"]\nbuild-backend = \"hatchling\"\n\n[project]\nname = \"pantryoracle\"\nversion = \"0.1.0\"\ndescription = \"PantryOracle API\"\nreadme = \"README.md\"\nrequires-python = \">=3.11\"\ndependencies = [\n    \"fastapi>=0.115\",\n    \"uvicorn[standard]>=0.32\",\n    \"pydantic>=2.9\",\n    \"pydantic-settings>=2.5\",\n    \"httpx>=0.27\",\n    \"aiosqlite>=0.20\",\n    \"loguru>=0.7\"\n]\n[project.optional-dependencies]\ndev = [\n    \"pytest>=8\",\n    \"pytest-asyncio>=0.24\",\n    \"httpx\"\n]\n[tool.hatch.build.targets.wheel]\npackages = [\"src/pantryoracle\"]\n[tool.hatch.metadata]\nallow-direct-references = true\n[tool.hatch.envs.default]\nscripts = [\n    \"start = \\\"uvicorn pantryoracle.main:app --host 0.0.0.0 --port 8000\\\"\"\n]"}